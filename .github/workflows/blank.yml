# 灵犀 Dia 3.0（水墨江湖 · 无极版）—— GitHub Actions 自动打包 APK
name: Android 打包

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受协议并安装 SDK 平台 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 解压项目 zip（自动识别）
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | grep -i lingxi | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "发现 zip：$ZIP，正在解压..."
            unzip -q "$ZIP"
            echo "解压完成，当前文件列表："
            ls -la
          else
            echo "未发现 zip，跳过解压"
          fi

      - name: 定位项目目录并赋予权限
        run: |
          GW=$(find . -maxdepth 4 -name gradlew -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GW" ]; then
            echo "❌ 找不到 gradlew，文件列表如下："
            find . -maxdepth 4 -type f | head -50
            exit 1
          fi
          DIR=$(dirname "$GW")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$GW"
          echo "✅ 项目目录：$DIR"

      - name: 打包 APK（含本机生图）
        id: full
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug -Pdia.localImageGen=true

      - name: 打包 APK（不含本机生图，备用）
        id: lite
        if: steps.full.outcome == 'failure'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug -Pdia.localImageGen=false

      - name: 打包 release APK（更流畅，可选）
        id: release
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleRelease -Pdia.localImageGen=${{ steps.full.outcome == 'success' }}

      - name: 运行单元测试（不影响打包结果）
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon testDebugUnitTest -Pdia.localImageGen=${{ steps.full.outcome == 'success' }}

      - name: 整理 APK 文件名
        run: |
          mkdir -p out
          TAG="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "out/LingXi-Dia-3.0-debug-$TAG.apk"
          if [ -f "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "out/LingXi-Dia-3.0-release-$TAG.apk"
          fi
          ls -la out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: LingXi-Dia-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
